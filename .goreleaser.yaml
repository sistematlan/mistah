# goreleaser config — produces signed darwin-arm64 + darwin-amd64 +
# windows-amd64 + linux-amd64 binaries on every git tag matching v*.
# Drives `curl mistah.sistematlan.com/install.sh | sh` end-to-end for
# macOS and Linux; Windows users download the .zip from GitHub
# Releases directly (see BACKLOG.md for the winget/scoop packaging
# follow-up).
#
# Apple notarization is NOT enabled yet (requires paid Developer ID).
# Users can bypass Gatekeeper one-time with `xattr -d com.apple.quarantine`
# until we add notarization in a future release.
#
# The Windows build has no code-signing certificate either — expect
# SmartScreen's "unknown publisher" prompt until we add one.
#
# Quick reference:
#   goreleaser release --snapshot --clean   # local dry-run
#   git tag v0.1.0 && git push --tags        # triggers .github/workflows/release.yml
version: 2

project_name: mistah

before:
  hooks:
    - go mod tidy

builds:
  - id: mistah
    main: ./
    binary: mistah
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is a real but tiny slice of the install base
      # (Surface Pro X and similar); skip it until someone asks rather
      # than shipping an untested cross-compile target.
      - goos: windows
        goarch: arm64
      # Linux arm64 (Raspberry Pi, AWS Graviton, etc.) is a real
      # audience too, but install.sh doesn't offer it yet either —
      # adding both together once there's a request avoids shipping an
      # artifact nobody can actually reach via the one-liner installer.
      - goos: linux
        goarch: arm64
    # ldflags trim debug paths and embed version metadata so `mistah --version`
    # (when we add it) reflects the tag.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  # Tarballs named like mistah_v0.1.0_darwin_arm64.tar.gz so install.sh can
  # construct the URL deterministically from arch + version. Windows
  # gets a .zip instead of .tar.gz — the platform-native convention,
  # and what most Windows users' tools (Explorer, PowerShell's
  # Expand-Archive) open without installing anything extra.
  - id: mistah-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE*
      - README*
      - SPEC.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: sistematlan
    name: mistah
  draft: false
  prerelease: auto
  name_template: "mistah {{ .Version }}"
  header: |
    ## mistah {{ .Version }}

    Limpia tu Mac al estilo open-source.

    ### Install

    ```sh
    curl -fsSL https://mistah.sistematlan.com/install.sh | sh
    ```

    Or download the binary for your architecture below and put it in your `PATH`.
  footer: |
    ---
    🌐 https://mistah.sistematlan.com · 🐙 https://github.com/sistematlan/mistah

# homebrew_casks publishes/updates a Homebrew cask in the
# sistematlan/tools tap on every release, so `brew install
# sistematlan/tools/mistah` (or `brew tap sistematlan/tools && brew
# install mistah`) always points at the version that was just tagged.
#
# Casks are a macOS-only Homebrew concept — Linuxbrew has no cask
# support at all, only formulas. That's fine here: Linux users are
# already steered to install.sh/go install in README.md, and the old
# `brews:` (formula) section this replaces never targeted Linux either
# (GoReleaser only pulled in the darwin archives). We use casks instead
# of the classic `brews:` formula section because GoReleaser deprecated
# `brews` for exactly this use case (installing a prebuilt binary, not
# building from source) — see goreleaser.com/deprecations#brews.
#
# Requires a PAT (not the default GITHUB_TOKEN) with write access to
# sistematlan/homebrew-tools, stored as the HOMEBREW_TAP_GITHUB_TOKEN
# repo secret and passed via the release workflow env — see
# .github/workflows/release.yml.
homebrew_casks:
  - name: mistah
    repository:
      owner: sistematlan
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries:
      - mistah
    homepage: "https://mistah.sistematlan.com"
    description: "CLI open-source que recupera espacio en disco: cachés, papelera, backups viejos y más. Sin telemetría, código auditable."
    commit_author:
      name: goreleaserbot
      email: bot@sistematlan.com
    commit_msg_template: "brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # mistah's darwin archives aren't code-signed/notarized (see the
    # header comment at the top of this file), so macOS Gatekeeper
    # quarantines the binary on first extraction. This hook strips
    # that quarantine flag post-install — the exact same fix
    # install.sh already applies for the curl|sh path — so `brew
    # install` users don't hit a Gatekeeper block that curl|sh users
    # never see.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mistah"]
          end
