# CI — runs Go tests and vet on every push and pull request.
# Fast feedback before tagging a release.
#
# Three jobs because mistah is multiplatform: build tags mean
# system_windows.go, cleaner_linux.go, etc. are invisible to a macOS
# compiler entirely (`go build`/`go vet` on macos-14 never even parses
# them). The windows/linux jobs are the only things that actually
# exercise that code — a macOS-only CI would let a platform-specific
# compile error ship unnoticed until someone runs it on a real machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # No -race here: cgo-based race detector support on windows/amd64
        # is flaky on GitHub's runners as of this writing. Correctness
        # coverage still runs; only the race-condition sanitizer is
        # skipped for this job.
        run: go test ./...

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...
